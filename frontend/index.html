<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agentic RAG copilot for enterprise HR policies and employee support." />
    <title>Enterprise Copilot</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        var theme = JSON.parse(localStorage.getItem('enterprise-copilot') || '{}').state?.theme || 'system'
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
