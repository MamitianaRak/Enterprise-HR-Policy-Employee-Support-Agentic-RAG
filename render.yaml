# Render Blueprint: https://render.com/docs/blueprint-spec
#   Backend  → Docker web service (FastAPI + LangGraph), from ./Dockerfile
#   Frontend → Static Site (React build), calls the backend directly; CORS allows only its origin.
#
# After the first deploy, check the two .onrender.com URLs Render assigned: if a name was taken,
# Render adds a suffix. Then update VITE_API_BASE_URL (frontend) and CORS_ORIGINS (backend) and redeploy.
# SQLite data (conversations, audit) is ephemeral on the free plan and is reset on each deploy or restart.

services:
  - type: web
    name: enterprise-copilot-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Secrets: entered in the Render dashboard on first deploy, never stored in git.
      - key: GOOGLE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true  # random value; read it in the dashboard to upload documents
      # Configuration
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://enterprise-copilot.onrender.com
      - key: PINECONE_INDEX_NAME
        value: enterprise-copilot
      - key: HR_NAMESPACE
        value: company-hr-kb
      - key: CLOUDOPS_NAMESPACE
        value: cloudops-runbooks
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL
        value: gemini-embedding-2-preview
      - key: EMBEDDING_DIMENSION
        value: "768"

  - type: web
    name: enterprise-copilot
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL
        value: https://enterprise-copilot-api.onrender.com
    routes:
      # Single-page app: /hr/c/... and other client routes load index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
